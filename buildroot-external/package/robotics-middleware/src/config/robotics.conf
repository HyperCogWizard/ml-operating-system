# Robotics Middleware Configuration
# 
# Configuration for the robotics engineering workbench

# Memory settings
tensor_memory_limit = 1073741824  # 1GB

# Device and agent limits
max_devices = 1024
max_agents = 256

# GGUF integration settings
gguf_version = 3.0

# Logging settings
log_level = info
log_file = /var/log/robotics-middleware.log

# Neural-symbolic middleware settings
scheme_interpreter = guile
scheme_modules_path = /usr/lib/robotics/scheme

# Hypergraph settings
enable_visualization = true
visualization_port = 8080

# Agent settings
default_cognitive_dimensions = 3
default_memory_size = 1024
default_attention_heads = 8
default_embedding_dim = 512

# Device driver settings
device_scan_interval = 1000  # milliseconds
device_timeout = 5000        # milliseconds

# GGUF export settings
auto_export_interval = 300   # seconds (5 minutes)
export_directory = /var/lib/robotics/exports

# HomeAssistant integration
homeassistant_api_url = http://supervisor/core/api
homeassistant_token_file = /etc/robotics/ha_token

# Marduk's Lab settings
lab_name = "Marduk's Robotics Lab"
lab_id = marduk-lab-001
distributed_cognition = true
p_system_support = true